# Server / HTTP configuration
# Override any value at runtime with -D<key>=<value>

# Listening port. Also overridable via the first CLI arg to Main.
server.port=8080

# Graceful-shutdown delay (seconds) for /stop endpoint.
server.stop.delay.seconds=1

# When false, the /stop endpoint and the editor save endpoints are blocked
# (the stop context is not registered at all; the editor save sub-paths
# return 403). Default false so a stock prod deploy is locked down — dev
# scripts should override with -Dserver.debug.endpoints.allow=true.
server.debug.endpoints.allow=false

# API and shutdown endpoint paths.
server.endpoint.map=/api/map
server.endpoint.traverse=/api/traverse
server.endpoint.config=/api/config
server.endpoint.stop=/stop-hf4-planner

# CORS / cache policy.
server.cors.allow.origin=*
server.cache.html=no-cache
server.cache.assets.seconds=0
# Map data is edited frequently in dev (new nodes, new edges); set to 0
# so the browser always re-fetches and stale points don't make new edges
# render as gaps.
server.cache.map.seconds=0

# Classpath locations for served resources.
server.static.prefix=static
server.map.resource=data-hf4-v2.json

# Request validation limits (must agree with the corresponding planner.* keys).
server.request.max.engines=4
server.request.max.fuel=56
server.request.max.dry.mass=23
