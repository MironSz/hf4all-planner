# Frontend / UI configuration
# Served as JSON at /api/config and consumed by index.html.
# Override any value at runtime with -D<key>=<value>

# Zoom and viewport.
ui.zoom.min=0.1
ui.zoom.max=1.5
ui.zoom.transition.ms=400
ui.viewport.initial.x.ratio=0.85
ui.viewport.initial.y.ratio=0.80
ui.image.fallback.width=5000
ui.image.fallback.height=5000

# Form defaults / limits.
ui.fuel.default=20
ui.fuel.min=0
ui.fuel.max=31
ui.dry.mass.default=4
ui.dry.mass.min=1
ui.dry.mass.max=23
ui.engines.max=4
ui.engine.thrust.default=3
ui.engine.fuel.default=2
ui.engine.pivots.default=0
ui.hydration.filter.min=0
ui.hydration.filter.max=4

# Interaction.
ui.node.click.radius=40
ui.start.node.click.radius=20
ui.search.max.results=20
ui.search.suggestions.max.height=220
ui.search.blur.delay.ms=150

# Rendering.
ui.filter.ring.radius=42
ui.reachable.indicator.radius=6
ui.route.line.width=8
ui.route.line.spacing=9
ui.engine.label.font.px=14

# Hex-editor "hide site" mask is drawn this much larger than the underlying
# hex so it overpaints the printed border (anti-aliased pixels at the edge).
# 1.0 = same size as the hex, 1.2 = 20 % bigger in each direction.
ui.hex.hide.mask.scale=1.20

# Opacity of the painted-over mask. 1.0 = fully opaque (printed site is
# completely replaced by the sampled solar-zone colour), 0.5 = mask blends
# half-and-half with the underlying site artwork.
ui.hex.hide.mask.opacity=0.5
