# Planner / pathfinder configuration
# Override any value at runtime with -D<key>=<value>

# Search depth and safety valve for the Pareto BFS.
planner.search.max.turns=24
planner.search.max.iterations=5000000

# Fuel (water tanks loaded) range accepted by the traverse endpoint.
# Wet Mass = dryMass + fuel must not exceed 32 (HF4A rule F3a). The strict
# upper bound on fuel alone is therefore 32 - planner.dry.mass.min = 31.
planner.fuel.min=0
planner.fuel.max=56

# Dry Mass range accepted by the traverse endpoint (HF4A rule F2a).
planner.dry.mass.min=1
planner.dry.mass.max=23

# Maximum engines allowed in a single traverse request.
planner.engines.max=4

# Reserved for the dedicated afterburn (H3a) implementation; ignored today.
planner.afterburn.enabled=false

# Solar-power thrust modifier per heliocentric zone (zones 0..7).
# Values comma-separated, must equal 8 entries.
planner.solar.zone.modifiers=2,1,0,0,-1,-2,-3,-4

# Known innermost-zone seed node id (used by SolarZoneInjector dev tool).
planner.solar.zone.seed.node=209
