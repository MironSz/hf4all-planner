# java.util.logging configuration for the HF4A planner.
# Loaded by Main.initLogging() at server startup.

# Both file and console get every event; the console gives interactive
# `mvn exec:java` users live output, the file is the persisted history.
handlers = java.util.logging.FileHandler, java.util.logging.ConsoleHandler

# Default log level for every logger that hasn't overridden it.
.level = INFO

# Per-package overrides — keep here as needed, e.g.:
# com.hf4all.planner.pathfinder.level = FINE

# -------------------------------------------------------------------
# File handler: rotate at 5 MB, keep 10 generations.
# Files appear as target/planner-0.log .. target/planner-9.log; the
# active file is %g=0 and older ones get higher numbers as they roll.
# Main.initLogging() ensures target/ exists before this handler binds.
# -------------------------------------------------------------------
java.util.logging.FileHandler.pattern   = target/planner-%g.log
java.util.logging.FileHandler.limit     = 5242880
java.util.logging.FileHandler.count     = 10
java.util.logging.FileHandler.append    = true
java.util.logging.FileHandler.encoding  = UTF-8
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.FileHandler.level     = INFO

# -------------------------------------------------------------------
# Console handler — the same SimpleFormatter, so console + file lines
# are byte-identical for easy correlation.
# -------------------------------------------------------------------
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.ConsoleHandler.level     = INFO

# -------------------------------------------------------------------
# Single line per event:
#   2026-04-29 17:00:00.123  INFO    [com.hf4all.planner.server.PlannerServer start] Server running at http://localhost:8080/
#
#   %1$tF       date (yyyy-MM-dd)
#   %1$tT.%1$tL time with millis (HH:mm:ss.SSS)
#   %4$-7s      level, left-padded to 7 chars
#   %2$s        source class + method (auto-inferred from logger.info(...))
#   %5$s        message
#   %6$s        thrown (empty if none)
# -------------------------------------------------------------------
java.util.logging.SimpleFormatter.format = %1$tF %1$tT.%1$tL  %4$-7s [%2$s] %5$s%6$s%n
