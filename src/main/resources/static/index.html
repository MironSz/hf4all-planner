<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HF4A Mission Planner</title>
<script src="/d3-dispatch.min.js"></script>
<script src="/d3-selection.min.js"></script>
<script src="/d3-color.min.js"></script>
<script src="/d3-interpolate.min.js"></script>
<script src="/d3-timer.min.js"></script>
<script src="/d3-ease.min.js"></script>
<script src="/d3-transition.min.js"></script>
<script src="/d3-drag.min.js"></script>
<script src="/d3-zoom.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; height: 100vh; background: #1a1a2e; color: #eee; font-family: monospace; overflow: hidden; }
#map-container { flex: 1; position: relative; overflow: hidden; }
#main { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
#main img { display: block; }
#main canvas { position: absolute; top: 0; left: 0; }
#sidebar { width: 300px; background: #16213e; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; border-left: 1px solid #333; }
h2 { font-size: 14px; color: #7ec8e3; margin-bottom: 4px; }
label { display: block; font-size: 12px; margin-bottom: 2px; color: #aaa; }
input[type="number"] { width: 100%; padding: 4px 6px; background: #0f3460; border: 1px solid #555; color: #eee; font-family: monospace; font-size: 13px; }
input[type="checkbox"] { margin-right: 6px; }
.engine-block { background: #0f3460; padding: 8px; border-radius: 4px; border: 1px solid #333; }
.engine-block h3 { font-size: 12px; color: #e94560; margin-bottom: 6px; }
.engine-row { display: flex; gap: 6px; margin-bottom: 4px; }
.engine-row > div { flex: 1; }
button { padding: 8px 16px; background: #e94560; color: white; border: none; cursor: pointer; font-family: monospace; font-size: 13px; border-radius: 4px; margin-bottom: 4px; }
button:hover { background: #c73650; }
button:disabled { background: #555; cursor: not-allowed; }
#status { font-size: 11px; color: #888; min-height: 40px; }
#node-info { font-size: 12px; color: #ccc; min-height: 30px; background: #0f3460; padding: 8px; border-radius: 4px; }
#debug-toggle { position: fixed; bottom: 12px; left: 12px; z-index: 100; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #888; }
#debug-toggle label { color: #888; margin: 0; cursor: pointer; user-select: none; }
#debug-toggle input { cursor: pointer; }
.route-arrow { width: 14px; flex: 0 0 14px; background: #143359; color: #7ec8e3; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; font-size: 11px; line-height: 1; }
.route-arrow:hover { background: #1e4a7a; color: #fff; }
#route-arrow-left  { border-radius: 4px 0 0 4px; }
#route-arrow-right { border-radius: 0 4px 4px 0; }
#tab-strip { display: flex; align-items: center; gap: 4px; margin: -16px -16px 4px -16px; padding: 6px 8px; background: #0a1a30; border-bottom: 1px solid #333; }
#tab-list { flex: 1; display: flex; gap: 2px; overflow-x: auto; min-width: 0; }
#tab-list::-webkit-scrollbar { height: 4px; }
#tab-list::-webkit-scrollbar-thumb { background: #333; }
.tab { background: #0f3460; border: 1px solid #222; border-radius: 4px; padding: 3px 4px 3px 8px; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 4px; white-space: nowrap; user-select: none; color: #aaa; }
.tab:hover { background: #143359; color: #ddd; }
.tab.active { background: #16213e; color: #7ec8e3; border-color: #555; }
.tab .tab-label { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.tab .tab-action { color: #888; cursor: pointer; padding: 0 3px; font-size: 12px; line-height: 1; border-radius: 2px; }
.tab .tab-action:hover { color: #fff; background: #1e4a7a; }
#new-tab { padding: 2px 8px; background: #0f3460; color: #7ec8e3; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 14px; line-height: 1; margin: 0; flex: 0 0 auto; }
#new-tab:hover { background: #1b3a70; color: #fff; }
#copy-route-btn { display: none; margin-top: 6px; padding: 2px 8px; background: #143359; color: #7ec8e3; border: 1px solid #555; border-radius: 3px; cursor: pointer; font-family: monospace; font-size: 11px; line-height: 1; }
#copy-route-btn:hover { background: #1e4a7a; color: #fff; }
#copy-route-btn.copied { background: #1a5b2a; color: #b0f0b0; border-color: #2e7a3e; }
</style>
</head>
<body>
<div id="debug-toggle">
    <input type="checkbox" id="debug-cb"><label for="debug-cb">Debug</label>
    <input type="checkbox" id="no-venus-cb" style="margin-left:12px;"><label for="no-venus-cb">Disable Venus flyby</label>
    <input type="checkbox" id="allow-jettison-cb" style="margin-left:12px;" checked><label for="allow-jettison-cb">Allow fuel jettison</label>
</div>
<div id="map-container">
    <div id="main">
        <img id="bg" alt="HF4A Map">
        <canvas id="canvas"></canvas>
    </div>
</div>
<div id="sidebar">
    <div id="tab-strip">
        <div id="tab-list"></div>
        <button id="new-tab" type="button" title="New tab">+</button>
    </div>

    <h2>HF4A Mission Planner</h2>

    <div id="search-box" style="position:relative;">
        <input type="text" id="search-input" placeholder="Search site by name or id..."
               autocomplete="off"
               style="width:100%;padding:6px 8px;background:#0f3460;border:1px solid #555;color:#eee;font-family:monospace;font-size:12px;box-sizing:border-box;">
        <div id="search-suggestions"
             style="display:none;position:absolute;left:0;right:0;top:100%;max-height:220px;overflow-y:auto;background:#0a1a30;border:1px solid #555;border-top:none;z-index:50;font-size:12px;"></div>
    </div>

    <div id="node-info">Click a node on the map to select start</div>

    <div id="route-info" style="display:none;background:#0a1a30;border-radius:4px;font-family:monospace;font-size:13px;color:#fff;margin-bottom:8px;align-items:stretch;">
        <div id="route-arrow-left" class="route-arrow" style="display:none;">◄</div>
        <div id="route-info-content" style="flex:1;padding:8px;min-width:0;">
            <div id="route-info-name" style="color:#2ecc71;font-weight:bold;font-size:15px;margin-bottom:4px;"></div>
            <div id="route-info-cost"></div>
            <div id="route-info-haz"></div>
            <div id="route-info-id" style="color:#888;font-size:11px;margin-top:4px;display:none;"></div>
            <button id="copy-route-btn" type="button" title="Copy full route details to clipboard">Copy route</button>
        </div>
        <div id="route-arrow-right" class="route-arrow" style="display:none;">►</div>
    </div>

    <div class="engine-row">
        <div>
            <label>Dry Mass (1-23):</label>
            <input type="number" id="dry-mass" value="4" min="1" max="23">
        </div>
        <div>
            <label>Fuel (0-31):</label>
            <input type="number" id="fuel" value="15" min="0" max="31">
        </div>
    </div>

    <div id="engines-container"></div>

    <button id="add-engine" type="button">+ Add Engine</button>

    <div id="site-filter" style="margin-top:10px;padding:8px;background:#0f3460;border-radius:4px;">
        <div style="font-size:12px;color:#ccc;margin-bottom:6px;">Site type filter</div>
        <div id="site-type-checks" style="display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:#ccc;">
            <label><input type="checkbox" class="site-type-cb" value="S"> S</label>
            <label><input type="checkbox" class="site-type-cb" value="M"> M</label>
            <label><input type="checkbox" class="site-type-cb" value="C"> C</label>
            <label><input type="checkbox" class="site-type-cb" value="V"> V</label>
            <label><input type="checkbox" class="site-type-cb" value="D"> D</label>
            <label><input type="checkbox" class="site-type-cb" value="H"> H</label>
        </div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:#ccc;">
            <label for="hydration-min">Min hydration (0-4):</label>
            <input type="number" id="hydration-min" value="" min="0" max="4" placeholder="" style="width:60px;">
        </div>
    </div>

    <div id="status">Loading map data...</div>
    <div id="debug-route" style="display:none;font-size:11px;color:#aaa;background:#0a1a30;padding:8px;border-radius:4px;max-height:40vh;overflow-y:auto;white-space:pre;font-family:monospace"></div>
</div>

<script>
(function() {
    // --- Configuration (loaded from /api/config; falls back to inline defaults) ---
    let CONFIG = {};
    const cfgI = (k, d) => { const v = CONFIG[k]; return v != null ? parseInt(v)   : d; };
    const cfgF = (k, d) => { const v = CONFIG[k]; return v != null ? parseFloat(v) : d; };

    // HF4A fuel strip intervals: indexed by Wet Mass position N, the value is
    // the number of black-line fuel steps between WM N and WM N+1. Matches
    // FuelStrip.INTERVALS on the backend. Indices 0 and 32 are unused.
    const FUEL_STRIP_INTERVALS = [
        0,                          // 0 (unused)
        9, 6, 4, 3, 3,              //  1↔2 ..  5↔6
        2, 2, 2, 2, 2,              //  6↔7 .. 10↔11
        1, 1, 1, 1, 1, 1, 1, 1, 1,  // 11↔12 .. 19↔20
        1, 1, 1, 1, 1, 1, 1, 1, 1,  // 20↔21 .. 28↔29
        1, 1, 1                     // 29↔30 .. 31↔32
    ];

    // Express `fuelSteps` remaining above `dryMass` as a position on the fuel
    // strip: "integer wet-mass jumps above dry" + "fraction of the current
    // interval". Produces text like "5/9", "1 2/6", "3" — matching how the
    // player reads the printed fuel strip.
    function formatFuelOnStrip(dryMass, fuelSteps) {
        let remaining = fuelSteps;
        let pos = Math.max(1, dryMass | 0);
        let complete = 0;
        while (pos < 32 && remaining >= FUEL_STRIP_INTERVALS[pos]) {
            remaining -= FUEL_STRIP_INTERVALS[pos];
            complete++;
            pos++;
        }
        const size = pos < 32 ? FUEL_STRIP_INTERVALS[pos] : 1;
        let display;
        if (remaining === 0)     display = String(complete);
        else if (complete === 0) display = remaining + '/' + size;
        else                     display = complete + ' ' + remaining + '/' + size;
        return display + ' (' + fuelSteps + ' fuel steps total)';
    }

    function applyConfigToForm() {
        const fuel = document.getElementById('fuel');
        fuel.value = cfgI('ui.fuel.default', 15);
        fuel.min   = cfgI('ui.fuel.min', 0);
        fuel.max   = cfgI('ui.fuel.max', 31);
        const dry = document.getElementById('dry-mass');
        dry.value = cfgI('ui.dry.mass.default', 4);
        dry.min   = cfgI('ui.dry.mass.min', 1);
        dry.max   = cfgI('ui.dry.mass.max', 23);
        const hyd = document.getElementById('hydration-min');
        hyd.min = cfgI('ui.hydration.filter.min', 0);
        hyd.max = cfgI('ui.hydration.filter.max', 4);
        document.getElementById('search-suggestions').style.maxHeight =
                cfgI('ui.search.suggestions.max.height', 220) + 'px';
    }

    // --- State ---
    let mapData = null;
    let selectedNode = null;    // starting node id
    let hoveredNode = null;     // node under cursor (temporary, while mouse is near)
    let pinnedEndpoint = null;  // clicked final destination (stays until ESC or new click)
    let selectedRouteIndex = 0; // which Pareto-optimal route to show (arrow keys)
    let traverseResult = null;  // response from /api/traverse
    let treeIndex = null;       // id → {node, parent} built from tree
    let reachableNodes = null;  // nodeId → [treeNodeId, ...] for all nodes in tree
    let debugMode = false;
    let debugHoveredNode = null; // nearest node under cursor (debug only, unfiltered)
    let imgW = 0, imgH = 0;
    // d3-zoom behavior and the selection it's bound to — captured in initCanvas
    // so the search box can pan the view programmatically.
    let zoomBehavior = null;
    let zoomSel = null;

    // =====================================================================
    // Tabs — multi-plan support.
    //
    // Each tab owns its own inputs (fuel, engines, filters, ...) plus its
    // interactive state (selected start, pinned endpoint, route index, zoom
    // transform, last traverseResult). The sidebar form DOM is shared across
    // tabs; switching a tab snapshots the previous tab's DOM into its state
    // and rewrites the DOM from the new tab's state. The shared canvas is
    // re-drawn from the new tab's traverseResult.
    // =====================================================================
    const TABS_STORAGE_KEY     = 'hf4a-tabs';
    const TABS_STORAGE_VERSION = 1;

    let tabs = [];
    let activeTab = null;
    let tabSeq = 1;             // monotonic id source
    let pendingFetchToken = 0;  // bumped on tab switch to discard stale fetches
    let suppressFire = false;   // skip fireTraverse during DOM rebuilds
    let tabsReady = false;      // gate snapshots until first activate

    function makeDefaultTabState() {
        return {
            dryMass: cfgI('ui.dry.mass.default', 4),
            fuel: cfgI('ui.fuel.default', 15),
            engines: [{
                baseThrust:       cfgI('ui.engine.thrust.default', 3),
                fuelConsumption:  cfgI('ui.engine.fuel.default',   2),
                solarPowered:     false,
                bonusPivots:      cfgI('ui.engine.pivots.default', 0),
            }],
            disableVenusFlyby: false,
            allowFuelJettison: true,
            debug:             false,
            siteFilter:        { types: [], minHydration: '' },
            searchQuery:       '',
            selectedNode:      null,
            pinnedEndpoint:    null,
            selectedRouteIndex: 0,
            zoomTransform:     null,   // {x,y,k} or null = use default viewport
            traverseResult:    null,
        };
    }

    function makeTab(name, state) {
        return {
            id: 'tab-' + (tabSeq++),
            name: name || 'Tab',
            state: state || makeDefaultTabState(),
        };
    }

    // Pull current DOM + module-level state into the active tab's state object.
    function snapshotActiveTabFromDom() {
        if (!activeTab || !tabsReady) return;
        const s = activeTab.state;
        s.dryMass = parseInt(document.getElementById('dry-mass').value) || 0;
        s.fuel = parseInt(document.getElementById('fuel').value) || 0;
        s.engines = [];
        document.querySelectorAll('.engine-block').forEach(b => {
            s.engines.push({
                baseThrust:      parseInt(b.querySelector('.e-base-thrust').value) || 0,
                fuelConsumption: parseInt(b.querySelector('.e-fuel').value)   || 0,
                solarPowered:    b.querySelector('.e-solar').checked,
                bonusPivots:     parseInt(b.querySelector('.e-pivots').value) || 0,
            });
        });
        s.disableVenusFlyby = document.getElementById('no-venus-cb').checked;
        s.allowFuelJettison = document.getElementById('allow-jettison-cb').checked;
        s.debug             = document.getElementById('debug-cb').checked;
        const types = [];
        document.querySelectorAll('.site-type-cb').forEach(cb => { if (cb.checked) types.push(cb.value); });
        s.siteFilter = {
            types,
            minHydration: document.getElementById('hydration-min').value,
        };
        s.searchQuery       = document.getElementById('search-input').value;
        s.selectedNode      = selectedNode;
        s.pinnedEndpoint    = pinnedEndpoint;
        s.selectedRouteIndex = selectedRouteIndex;
        s.traverseResult    = traverseResult;
        if (zoomSel && zoomBehavior) {
            const t = d3.zoomTransform(zoomSel.node());
            s.zoomTransform = { x: t.x, y: t.y, k: t.k };
        }
    }

    function renderStartLabel(nodeId) {
        const p = mapData && mapData.points && mapData.points[nodeId];
        if (!p) return 'Start: ' + nodeId;
        let info = nodeId.substring(0, 8) + '... (' + (p.type || '?') + ')';
        if (p.siteName) info = p.siteName + ' (' + p.type + ')';
        return 'Start: ' + info;
    }

    // Push the active tab's state into the DOM + module-level vars + canvas.
    function renderActiveTabToDom() {
        if (!activeTab) return;
        const s = activeTab.state;

        document.getElementById('dry-mass').value      = (s.dryMass != null) ? s.dryMass : cfgI('ui.dry.mass.default', 4);
        document.getElementById('fuel').value          = s.fuel;
        document.getElementById('no-venus-cb').checked       = !!s.disableVenusFlyby;
        document.getElementById('allow-jettison-cb').checked = (s.allowFuelJettison !== false);
        document.getElementById('debug-cb').checked    = !!s.debug;
        debugMode = !!s.debug;
        document.getElementById('search-input').value  = s.searchQuery || '';
        document.getElementById('hydration-min').value = (s.siteFilter && s.siteFilter.minHydration) || '';
        const ft = (s.siteFilter && s.siteFilter.types) || [];
        document.querySelectorAll('.site-type-cb').forEach(cb => {
            cb.checked = ft.indexOf(cb.value) >= 0;
        });

        // Rebuild engine blocks without firing traverse for each
        document.getElementById('engines-container').innerHTML = '';
        suppressFire = true;
        const enginesToRender = (s.engines && s.engines.length > 0) ? s.engines : [null];
        enginesToRender.forEach(eng => addEngineBlock(eng));
        suppressFire = false;

        selectedNode       = s.selectedNode || null;
        pinnedEndpoint     = s.pinnedEndpoint || null;
        selectedRouteIndex = s.selectedRouteIndex || 0;
        hoveredNode        = null;
        traverseResult     = s.traverseResult || null;
        treeIndex          = (traverseResult && traverseResult.tree) ? buildTreeIndex(traverseResult.tree) : null;
        if (!traverseResult) reachableNodes = null;

        document.getElementById('node-info').textContent = selectedNode
            ? renderStartLabel(selectedNode)
            : 'Click a node on the map to select start';
        document.getElementById('status').textContent = traverseResult
            ? ((traverseResult.endpoints ? Object.keys(traverseResult.endpoints).length : 0)
                + ' sites reachable.')
            : '';

        // Restore zoom (or use the configured initial viewport for fresh tabs)
        if (zoomSel && zoomBehavior && imgW) {
            if (s.zoomTransform) {
                zoomSel.call(zoomBehavior.transform,
                    d3.zoomIdentity
                        .translate(s.zoomTransform.x, s.zoomTransform.y)
                        .scale(s.zoomTransform.k));
            } else {
                zoomSel.call(zoomBehavior.translateTo,
                    cfgF('ui.viewport.initial.x.ratio', 0.85) * imgW,
                    cfgF('ui.viewport.initial.y.ratio', 0.80) * imgH);
            }
        }

        draw();
        updateRouteInfo();
        updateDebugRoute();

        // If the tab has a start node but no cached results, plan now.
        if (selectedNode && !traverseResult) {
            fireTraverse();
        }
    }

    function activateTab(tab) {
        if (activeTab === tab) return;
        if (activeTab && tabsReady) snapshotActiveTabFromDom();
        activeTab = tab;
        pendingFetchToken++; // discard any in-flight fetch from prior tab
        if (mapData && imgW) renderActiveTabToDom();
        renderTabStrip();
        persistTabs();
    }

    function newTab() {
        if (activeTab && tabsReady) snapshotActiveTabFromDom();
        const tab = makeTab('Tab ' + (tabs.length + 1));
        tabs.push(tab);
        activateTab(tab);
    }

    function duplicateTab(srcTab) {
        if (srcTab === activeTab && tabsReady) snapshotActiveTabFromDom();
        const cloned = JSON.parse(JSON.stringify(srcTab.state));
        const tab = makeTab(srcTab.name + ' copy', cloned);
        const idx = tabs.indexOf(srcTab);
        tabs.splice(idx + 1, 0, tab);
        activateTab(tab);
    }

    function closeTab(tab) {
        const idx = tabs.indexOf(tab);
        if (idx < 0) return;
        if (tabs.length === 1) {
            // Replace with a blank rather than leaving zero tabs
            const fresh = makeTab('Tab 1');
            tabs[0] = fresh;
            activeTab = null;
            activateTab(fresh);
            return;
        }
        tabs.splice(idx, 1);
        if (tab === activeTab) {
            const next = tabs[Math.min(idx, tabs.length - 1)];
            activeTab = null;
            activateTab(next);
        } else {
            renderTabStrip();
            persistTabs();
        }
    }

    function renameTab(tab, name) {
        if (!name || !name.trim()) return;
        tab.name = name.trim().substring(0, 30);
        renderTabStrip();
        persistTabs();
    }

    function renderTabStrip() {
        const list = document.getElementById('tab-list');
        list.innerHTML = '';
        tabs.forEach(tab => {
            const el = document.createElement('div');
            el.className = 'tab' + (tab === activeTab ? ' active' : '');
            el.title = tab.name + ' — double-click to rename, middle-click to close';

            const label = document.createElement('span');
            label.className = 'tab-label';
            label.textContent = tab.name;
            label.addEventListener('click',     () => activateTab(tab));
            label.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                const name = prompt('Rename tab:', tab.name);
                if (name != null) renameTab(tab, name);
            });
            el.appendChild(label);

            const dup = document.createElement('span');
            dup.className = 'tab-action';
            dup.textContent = '⎘';
            dup.title = 'Duplicate tab';
            dup.addEventListener('click', (e) => { e.stopPropagation(); duplicateTab(tab); });
            el.appendChild(dup);

            const close = document.createElement('span');
            close.className = 'tab-action';
            close.textContent = '×';
            close.title = 'Close tab';
            close.addEventListener('click', (e) => { e.stopPropagation(); closeTab(tab); });
            el.appendChild(close);

            // Middle-click anywhere on the tab also closes it.
            el.addEventListener('mousedown', (e) => {
                if (e.button === 1) { e.preventDefault(); closeTab(tab); }
            });

            list.appendChild(el);
        });
    }

    // ----- Persistence -----
    let persistDebounce = null;
    function persistTabs() {
        clearTimeout(persistDebounce);
        persistDebounce = setTimeout(() => {
            if (tabsReady) snapshotActiveTabFromDom();
            const payload = {
                version: TABS_STORAGE_VERSION,
                activeTabId: activeTab ? activeTab.id : null,
                tabs: tabs.map(t => ({ id: t.id, name: t.name, state: t.state })),
            };
            try {
                localStorage.setItem(TABS_STORAGE_KEY, JSON.stringify(payload));
            } catch (err) {
                // QuotaExceeded is the realistic failure here. Drop traverseResult
                // (the heaviest field) and retry once before giving up.
                console.warn('Persisting tabs failed; dropping cached results:', err);
                try {
                    const lite = {
                        version: TABS_STORAGE_VERSION,
                        activeTabId: payload.activeTabId,
                        tabs: payload.tabs.map(t => ({
                            id: t.id, name: t.name,
                            state: Object.assign({}, t.state, { traverseResult: null }),
                        })),
                    };
                    localStorage.setItem(TABS_STORAGE_KEY, JSON.stringify(lite));
                } catch (err2) {
                    console.warn('Persisting tabs (lite) failed:', err2);
                }
            }
        }, 200);
    }

    function loadTabsFromStorage() {
        try {
            const raw = localStorage.getItem(TABS_STORAGE_KEY);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (!data || data.version !== TABS_STORAGE_VERSION) return null;
            if (!Array.isArray(data.tabs) || data.tabs.length === 0) return null;
            tabs = data.tabs.map(t => {
                const def = makeDefaultTabState();
                const state = Object.assign(def, t.state || {});
                const id = t.id || ('tab-' + (tabSeq++));
                const m = /tab-(\d+)/.exec(id);
                if (m) tabSeq = Math.max(tabSeq, parseInt(m[1]) + 1);
                return { id, name: t.name || 'Tab', state };
            });
            return data.activeTabId;
        } catch (err) {
            console.warn('Loading tabs failed; starting fresh:', err);
            return null;
        }
    }

    function initTabs() {
        const savedActive = loadTabsFromStorage();
        if (tabs.length === 0) {
            tabs.push(makeTab('Tab 1'));
        }
        const target = tabs.find(t => t.id === savedActive) || tabs[0];
        activeTab = null;
        tabsReady = true;
        activateTab(target);
    }

    document.getElementById('new-tab').addEventListener('click', newTab);

    document.getElementById('debug-cb').addEventListener('change', (e) => {
        debugMode = e.target.checked;
        draw();
        updateDebugRoute();
        updateRouteInfo();
        persistTabs();
    });

    // Toggling Venus-flyby-disable re-plans the current start, so the new
    // routing constraint takes effect without the user having to click again.
    document.getElementById('no-venus-cb').addEventListener('change', () => {
        if (selectedNode) fireTraverse();
        persistTabs();
    });

    document.getElementById('allow-jettison-cb').addEventListener('change', () => {
        if (selectedNode) fireTraverse();
        persistTabs();
    });

    // --- Search box: filter sites by name or id, focus map on pick ---
    (function() {
        const input = document.getElementById('search-input');
        const list  = document.getElementById('search-suggestions');
        let suggestions = []; // array of {id, label}
        let activeIdx = -1;

        function renderList() {
            if (suggestions.length === 0) { list.style.display = 'none'; return; }
            list.innerHTML = '';
            suggestions.forEach((s, i) => {
                const row = document.createElement('div');
                row.textContent = s.label;
                row.style.cssText = 'padding:4px 8px;cursor:pointer;color:#ccc;'
                        + (i === activeIdx ? 'background:#1b3a70;color:#fff;' : '');
                row.addEventListener('mousedown', (ev) => {
                    ev.preventDefault(); // keep focus in input
                    choose(i);
                });
                list.appendChild(row);
            });
            list.style.display = 'block';
        }

        function updateSuggestions() {
            const q = input.value.trim().toLowerCase();
            if (!mapData || !q) { suggestions = []; activeIdx = -1; renderList(); return; }
            const matches = [];
            for (const [id, p] of Object.entries(mapData.points)) {
                if (p.type === 'decorative') continue;
                const name = p.siteName || '';
                if (name.toLowerCase().includes(q) || id.toLowerCase().startsWith(q)) {
                    matches.push({
                        id,
                        label: name ? `${name}  [${p.type}]` : `${id.substring(0, 14)}  [${p.type}]`
                    });
                    if (matches.length >= cfgI('ui.search.max.results', 20)) break;
                }
            }
            suggestions = matches;
            activeIdx = matches.length > 0 ? 0 : -1;
            renderList();
        }

        function focusNode(id) {
            const p = mapData && mapData.points && mapData.points[id];
            if (!p || !zoomBehavior || !zoomSel) return;
            // Center the view on the target node. translateTo operates on
            // content coordinates (pre-zoom), so we pass the node's image pos.
            zoomSel.transition().duration(cfgI('ui.zoom.transition.ms', 400))
                .call(zoomBehavior.translateTo, p.x * imgW, p.y * imgH);
        }

        function choose(i) {
            if (i < 0 || i >= suggestions.length) return;
            const pick = suggestions[i];
            input.value = pick.label.split('  ')[0];
            suggestions = [];
            renderList();
            focusNode(pick.id);
            input.blur();
        }

        input.addEventListener('input', updateSuggestions);
        input.addEventListener('focus', updateSuggestions);
        input.addEventListener('blur', () => {
            // Delay hide so mousedown on a row can still fire
            setTimeout(() => { list.style.display = 'none'; }, cfgI('ui.search.blur.delay.ms', 150));
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') {
                if (suggestions.length === 0) return;
                activeIdx = (activeIdx + 1) % suggestions.length;
                renderList();
                e.preventDefault();
            } else if (e.key === 'ArrowUp') {
                if (suggestions.length === 0) return;
                activeIdx = (activeIdx - 1 + suggestions.length) % suggestions.length;
                renderList();
                e.preventDefault();
            } else if (e.key === 'Enter') {
                if (activeIdx >= 0) choose(activeIdx);
                else if (suggestions.length > 0) choose(0);
                e.preventDefault();
            } else if (e.key === 'Escape') {
                input.blur();
                list.style.display = 'none';
            }
        });
    })();

    const bgImg = document.getElementById('bg');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const mainEl = document.getElementById('main');
    const container = document.getElementById('map-container');

    // --- Load config, then map data, then image ---
    fetch('/api/config')
        .then(r => r.json())
        .then(cfg => { CONFIG = cfg; })
        .catch(err => { console.warn('Config load failed; using defaults:', err); })
        .finally(() => {
            applyConfigToForm();
            fetch('/api/map')
                .then(r => r.json())
                .then(data => {
                    mapData = data;
                    document.getElementById('status').textContent = 'Loading map image...';
                    // Tabs are initialized after initCanvas() so the zoom transform
                    // can be restored as part of the first activateTab().
                    bgImg.onload = () => { initCanvas(); initTabs(); };
                    bgImg.onerror = () => {
                        document.getElementById('status').textContent = 'Image failed to load. Using plain canvas.';
                        initCanvas();
                        initTabs();
                    };
                    bgImg.src = '/hf4.jpg';
                })
                .catch(err => {
                    document.getElementById('status').textContent = 'Failed to load map: ' + err;
                });
        });

    // --- Canvas setup ---
    function initCanvas() {
        imgW = bgImg.naturalWidth  || cfgI('ui.image.fallback.width',  5000);
        imgH = bgImg.naturalHeight || cfgI('ui.image.fallback.height', 5000);
        canvas.width = imgW;
        canvas.height = imgH;

        const z = d3.zoom()
            .scaleExtent([cfgF('ui.zoom.min', 0.1), cfgF('ui.zoom.max', 1.5)])
            .translateExtent([[0, 0], [imgW, imgH]])
            .filter((event) => !event.ctrlKey && !event.button)
            .on('zoom', (event) => {
                const {x, y, k} = event.transform;
                mainEl.style.transform = `translate(${x}px,${y}px) scale(${k})`;
                // User-driven pan/zoom updates the active tab's transform.
                // sourceEvent is null when we set the transform programmatically
                // during tab activation — skip those to avoid persistence churn.
                if (event.sourceEvent && tabsReady) persistTabs();
            });

        zoomBehavior = z;
        zoomSel = d3.select(container);
        zoomSel.call(z)
            .call(z.translateTo,
                  cfgF('ui.viewport.initial.x.ratio', 0.85) * imgW,
                  cfgF('ui.viewport.initial.y.ratio', 0.80) * imgH);

        canvas.addEventListener('click', onCanvasClick);
        canvas.addEventListener('mousemove', onCanvasMouseMove);
        draw();
    }

    // --- Find nearest node to map coordinates ---
    // filterSet: if provided, only consider nodes whose id is a key in this object
    function findNearest(mapX, mapY, maxDist, filterSet) {
        let nearest = null;
        let nearestDist = Infinity;
        for (const [id, p] of Object.entries(mapData.points)) {
            if (p.type === 'decorative') continue;
            if (filterSet && !(id in filterSet)) continue;
            const px = p.x * imgW;
            const py = p.y * imgH;
            const dist = Math.hypot(px - mapX, py - mapY);
            if (dist < nearestDist) {
                nearestDist = dist;
                nearest = id;
            }
        }
        return (nearest && nearestDist < maxDist) ? nearest : null;
    }

    // --- Click: select start node or pin endpoint ---
    function onCanvasClick(event) {
        if (!mapData) return;

        // If we already have a start + routes, clicking pins an endpoint
        if (selectedNode && reachableNodes) {
            const epId = findNearest(event.offsetX, event.offsetY, cfgI('ui.node.click.radius', 40), reachableNodes);
            if (epId) {
                pinnedEndpoint = epId;
                selectedRouteIndex = 0;
                draw();
                updateDebugRoute();
                updateRouteInfo();
                persistTabs();
                return;
            }
            return; // click on nothing — ignore (ESC to clear)
        }

        // No start yet — select start node
        const nodeId = findNearest(event.offsetX, event.offsetY, cfgI('ui.start.node.click.radius', 20));
        if (!nodeId) return;

        selectedNode = nodeId;
        hoveredNode = null;
        pinnedEndpoint = null;
        selectedRouteIndex = 0;
        traverseResult = null;

        const p = mapData.points[nodeId];
        let info = nodeId.substring(0, 8) + '... (' + (p.type || '?') + ')';
        if (p.siteName) info = p.siteName + ' (' + p.type + ')';
        document.getElementById('node-info').textContent = 'Start: ' + info;

        draw();
        fireTraverse();
    }

    // --- Build flat index from tree: id → {node, parent} (iterative to handle deep trees) ---
    // Also builds reachableNodes: mapNodeId → [treeNodeId, ...] for all nodes in tree
    function buildTreeIndex(tree) {
        const index = {};
        const reachable = {};
        const stack = [{ node: tree, parent: null }];
        while (stack.length > 0) {
            const { node, parent } = stack.pop();
            index[node.id] = { node, parent };
            const mapId = node.nodeId;
            if (!reachable[mapId]) reachable[mapId] = [];
            reachable[mapId].push(node.id);
            for (const child of (node.children || [])) {
                stack.push({ node: child, parent: node });
            }
        }
        reachableNodes = reachable;
        return index;
    }

    // --- Get path from tree root to a given tree node id ---
    function getPathToRoot(treeNodeId) {
        if (!treeIndex) return [];
        const path = [];
        let entry = treeIndex[treeNodeId];
        while (entry) {
            path.unshift(entry.node);
            entry = entry.parent ? treeIndex[entry.parent.id] : null;
        }
        return path;
    }

    // --- Active endpoint: pinned takes priority, hovered is temporary preview ---
    function getActiveEndpoint() {
        if (hoveredNode && reachableNodes && reachableNodes[hoveredNode]) return hoveredNode;
        return pinnedEndpoint;
    }

    // --- Get tree node IDs for a given map node (endpoints first, then all reachable) ---
    // Multiple tree nodes can share the same physical map node but trace the
    // exact same visible map-node sequence back to root (they differ only in
    // internal search-state). Dedupe by path so arrow-key cycling only shows
    // genuinely distinct routes.
    function getTreeNodeIds(nodeId) {
        let rawIds = null;
        if (traverseResult && traverseResult.endpoints && traverseResult.endpoints[nodeId]) {
            rawIds = traverseResult.endpoints[nodeId];
        } else if (reachableNodes && reachableNodes[nodeId]) {
            rawIds = reachableNodes[nodeId];
        }
        if (!rawIds) return null;
        if (rawIds.length <= 1) return rawIds;
        const seen = new Set();
        const unique = [];
        for (const tid of rawIds) {
            const seq = getPathToRoot(tid).map(n => n.nodeId).join('|');
            if (!seen.has(seq)) {
                seen.add(seq);
                unique.push(tid);
            }
        }
        return unique;
    }

    function getActiveRouteIndex() {
        const active = getActiveEndpoint();
        if (active === pinnedEndpoint) return selectedRouteIndex;
        return 0; // hover always shows first route
    }

    // --- Hover: highlight route to hovered endpoint ---
    function onCanvasMouseMove(event) {
        let needsDraw = false;
        if (mapData && reachableNodes) {
            const nodeId = findNearest(event.offsetX, event.offsetY, cfgI('ui.node.click.radius', 40), reachableNodes);
            if (nodeId !== hoveredNode) {
                hoveredNode = nodeId;
                needsDraw = true;
                updateDebugRoute();
                updateRouteInfo();
            }
        }
        if (debugMode && mapData) {
            const dbgId = findNearest(event.offsetX, event.offsetY, cfgI('ui.start.node.click.radius', 20));
            if (dbgId !== debugHoveredNode) {
                debugHoveredNode = dbgId;
                needsDraw = true;
            }
        }
        if (needsDraw) draw();
    }

    // --- Keyboard: ESC clears selection, arrows cycle routes ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            selectedNode = null;
            pinnedEndpoint = null;
            hoveredNode = null;
            selectedRouteIndex = 0;
            traverseResult = null;
            treeIndex = null;
            reachableNodes = null;
            document.getElementById('node-info').textContent = 'Click a node on the map to select start';
            document.getElementById('status').textContent = '';
            draw();
            updateDebugRoute();
            updateRouteInfo();
            persistTabs();
            return;
        }
        const active = getActiveEndpoint();
        if (!active) return;
        const ids = getTreeNodeIds(active);
        if (!ids || ids.length <= 1) return;
        if (e.key === 'ArrowRight') {
            selectedRouteIndex = (selectedRouteIndex + 1) % ids.length;
            // pin if we're cycling via arrows on a hovered (non-pinned) node
            if (!pinnedEndpoint) { pinnedEndpoint = active; }
            draw();
            updateDebugRoute();
            updateRouteInfo();
            persistTabs();
        } else if (e.key === 'ArrowLeft') {
            selectedRouteIndex = (selectedRouteIndex - 1 + ids.length) % ids.length;
            if (!pinnedEndpoint) { pinnedEndpoint = active; }
            draw();
            updateDebugRoute();
            updateRouteInfo();
            persistTabs();
        }
    });

    function updateRouteInfo() {
        const panel = document.getElementById('route-info');
        const leftArrow = document.getElementById('route-arrow-left');
        const rightArrow = document.getElementById('route-arrow-right');
        const active = getActiveEndpoint();
        if (!active) { panel.style.display = 'none'; return; }
        const treeNodeIds = getTreeNodeIds(active);
        if (!treeNodeIds || treeNodeIds.length === 0) {
            panel.style.display = 'none';
            return;
        }
        const idx = getActiveRouteIndex();
        const pathNodes = getPathToRoot(treeNodeIds[idx % treeNodeIds.length]);
        const endNode = pathNodes[pathNodes.length - 1];
        const hp = mapData.points[active];
        if (!endNode || !hp) { panel.style.display = 'none'; return; }

        const name = hp.siteName || active.substring(0, 10);
        const routeLabel = treeNodeIds.length > 1
                ? `  [${idx + 1}/${treeNodeIds.length}]` : '';
        document.getElementById('route-info-name').textContent = name + routeLabel;
        const dry = parseInt(document.getElementById('dry-mass').value) || cfgI('ui.dry.mass.default', 4);
        document.getElementById('route-info-cost').textContent =
                'fuel: ' + endNode.fuelSpent
                + '  left: ' + formatFuelOnStrip(dry, endNode.fuelStepsRemaining)
                + '  turns: ' + endNode.turns;
        document.getElementById('route-info-haz').textContent =
                'haz: ' + endNode.hazards + '  rad: ' + endNode.worstRadRoll;
        const idEl = document.getElementById('route-info-id');
        const copyBtn = document.getElementById('copy-route-btn');
        if (debugMode) {
            idEl.textContent = 'id: ' + active;
            idEl.style.display = 'block';
            copyBtn.style.display = 'inline-block';
        } else {
            idEl.style.display = 'none';
            copyBtn.style.display = 'none';
        }
        panel.style.display = 'flex';
        const showArrows = treeNodeIds.length > 1;
        leftArrow.style.display  = showArrows ? 'flex' : 'none';
        rightArrow.style.display = showArrows ? 'flex' : 'none';
    }

    // Arrow clicks mirror the ArrowLeft/ArrowRight key behavior: cycle the
    // selected Pareto route for the active endpoint, pinning the endpoint if
    // it was only hovered.
    function cycleRoute(delta) {
        const active = getActiveEndpoint();
        if (!active) return;
        const ids = getTreeNodeIds(active);
        if (!ids || ids.length <= 1) return;
        selectedRouteIndex = (selectedRouteIndex + delta + ids.length) % ids.length;
        if (!pinnedEndpoint) pinnedEndpoint = active;
        draw();
        updateDebugRoute();
        updateRouteInfo();
        persistTabs();
    }
    document.getElementById('route-arrow-left')
            .addEventListener('click', () => cycleRoute(-1));
    document.getElementById('route-arrow-right')
            .addEventListener('click', () => cycleRoute(+1));

    // Builds the textual route dump rendered in the debug panel and copied to
    // the clipboard. Returns null when there's no active endpoint.
    function buildRouteDetailText() {
        const active = getActiveEndpoint();
        if (!active) return null;
        const treeNodeIds = getTreeNodeIds(active);
        if (!treeNodeIds || treeNodeIds.length === 0) return null;
        const idx = getActiveRouteIndex();
        const pathNodes = getPathToRoot(treeNodeIds[idx]);

        const header = `Route ${idx + 1}/${treeNodeIds.length} to ${active.substring(0, 12)}`;
        const lines = pathNodes.map((n, i) => {
            const p = mapData.points[n.nodeId];
            const name = (p && p.siteName) ? p.siteName : n.nodeId.substring(0, 12);
            const type = (p && p.type) ? p.type : '?';
            const eng = (n.engineIndex != null && n.engineIndex >= 0)
                    ? ` e${n.engineIndex + 1}` : '';
            return `${i}) ${name} [${type}] t${n.turns} f${n.fuelSpent} h${n.hazards} r${n.worstRadRoll}${eng}`;
        });
        return header + '\n' + lines.join('\n');
    }

    function updateDebugRoute() {
        const el = document.getElementById('debug-route');
        if (!debugMode) { el.style.display = 'none'; return; }
        const text = buildRouteDetailText();
        if (text == null) { el.style.display = 'none'; return; }
        el.textContent = text;
        el.style.display = 'block';
    }

    // Copy-to-clipboard button (only shown in debug mode alongside route-info).
    document.getElementById('copy-route-btn').addEventListener('click', () => {
        const btn = document.getElementById('copy-route-btn');
        const text = buildRouteDetailText();
        if (text == null) return;
        const onOk = () => {
            const orig = btn.textContent;
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1200);
        };
        // navigator.clipboard is unavailable over plain http from non-localhost
        // origins; fall back to a hidden textarea + execCommand.
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(onOk).catch(() => fallbackCopy(text, onOk));
        } else {
            fallbackCopy(text, onOk);
        }
    });

    function fallbackCopy(text, onOk) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); onOk(); } catch {}
        document.body.removeChild(ta);
    }

    // --- Site filter ---
    /**
     * Reads the sidebar site filter. The filter is "active" only when at
     * least one site type is checked OR a hydration number is entered; when
     * both are empty the filter is off and no rings are drawn.
     */
    function readSiteFilter() {
        const checks = document.querySelectorAll('.site-type-cb');
        const types = new Set();
        checks.forEach(cb => { if (cb.checked) types.add(cb.value); });
        const hydrationInput = document.getElementById('hydration-min');
        const raw = (hydrationInput.value || '').trim();
        const hasHydration = raw !== '';
        const minHydration = hasHydration
                ? Math.max(cfgI('ui.hydration.filter.min', 0),
                           Math.min(cfgI('ui.hydration.filter.max', 4), parseInt(raw) || 0))
                : null;
        const active = types.size > 0 || hasHydration;
        return { active, types, minHydration };
    }

    /**
     * A site matches the filter when its size-class letter is in the selected
     * type set (or no types are selected) AND its siteWater rating meets the
     * minimum hydration (or no hydration was entered). Inactive filter never
     * matches.
     */
    function siteMatchesFilter(point, filter) {
        if (!filter.active) return false;
        // Extract trailing size-class letter from siteSize (e.g. "10C" -> "C").
        const sizeStr = point.siteSize || '';
        let letter = '';
        for (let i = sizeStr.length - 1; i >= 0; i--) {
            const ch = sizeStr.charAt(i);
            if (ch >= 'A' && ch <= 'Z') { letter = ch; break; }
        }
        const typeOk = filter.types.size === 0 || filter.types.has(letter);
        // siteWater is stored as a string in the JSON; coerce to int.
        const water = parseInt(point.siteWater) || 0;
        const hydrationOk = filter.minHydration === null
                || water >= filter.minHydration;
        return typeOk && hydrationOk;
    }

    // --- Drawing ---
    function draw() {
        if (!mapData || !imgW) return;
        const { points, edges } = mapData;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw edges
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        for (const edgeStr of edges) {
            const colon = edgeStr.indexOf(':');
            const a = points[edgeStr.substring(0, colon)];
            const b = points[edgeStr.substring(colon + 1)];
            if (!a || !b) continue;
            ctx.beginPath();
            ctx.moveTo(a.x * imgW, a.y * imgH);
            ctx.lineTo(b.x * imgW, b.y * imgH);
            ctx.stroke();
        }

        // Draw reachable site indicators (small dots for all reachable sites)
        if (traverseResult && traverseResult.endpoints) {
            for (const nodeId of Object.keys(traverseResult.endpoints)) {
                if (nodeId === selectedNode) continue;
                const p = points[nodeId];
                if (!p) continue;
                ctx.beginPath();
                ctx.arc(p.x * imgW, p.y * imgH, cfgI('ui.reachable.indicator.radius', 6), 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(46, 204, 113, 0.6)';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        // Draw filter-matching rings: reachable sites whose type/hydration match
        // the sidebar site filter get a translucent green disc with a solid
        // green ring around them.
        if (traverseResult && traverseResult.endpoints) {
            const filter = readSiteFilter();
            ctx.lineWidth = 3;
            for (const nodeId of Object.keys(traverseResult.endpoints)) {
                const p = points[nodeId];
                if (!p || p.type !== 'site') continue;
                if (!siteMatchesFilter(p, filter)) continue;
                ctx.beginPath();
                ctx.arc(p.x * imgW, p.y * imgH, cfgI('ui.filter.ring.radius', 42), 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(46, 204, 113, 0.25)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(46, 204, 113, 1.0)';
                ctx.stroke();
            }
        }

        // Draw highlighted route path (for active endpoint: pinned or hovered)
        const activeEp = getActiveEndpoint();
        const activeIdx = getActiveRouteIndex();
        const treeNodeIds = activeEp ? getTreeNodeIds(activeEp) : null;
        if (activeEp && treeNodeIds && treeNodeIds.length > 0) {
            const treeNodeId = treeNodeIds[activeIdx % treeNodeIds.length];
            const pathNodes = getPathToRoot(treeNodeId);
            if (pathNodes.length >= 2) {
                // Yellow and blue are reserved by the printed HF4A boardgame map
                // (used to highlight orbital routes), so they're omitted here.
                const turnColors = [
                    'rgba(0,200,200,0.9)',    // turn 1 — cyan/teal
                    'rgba(255,100,0,0.9)',    // turn 2 — orange
                    'rgba(180,0,255,0.9)',    // turn 3 — purple
                    'rgba(0,255,100,0.9)',    // turn 4 — green
                    'rgba(255,50,50,0.9)',    // turn 5 — red
                    'rgba(255,100,200,0.9)',  // turn 6 — pink
                    'rgba(150,255,0,0.9)',    // turn 7 — lime
                    'rgba(180,120,60,0.9)',   // turn 8 — brown
                ];
                // Group segments by undirected edge so that when the same edge
                // is traversed across multiple turns, each turn gets its own
                // parallel line (offset perpendicular to the edge) instead of
                // overdrawing a single colored line.
                const segmentsByEdge = new Map();
                for (let i = 1; i < pathNodes.length; i++) {
                    const a = pathNodes[i - 1].nodeId;
                    const b = pathNodes[i].nodeId;
                    const key = a < b ? a + '|' + b : b + '|' + a;
                    const turn = pathNodes[i].turns;
                    if (!segmentsByEdge.has(key)) {
                        segmentsByEdge.set(key, { a, b, turns: [] });
                    }
                    const entry = segmentsByEdge.get(key);
                    // De-dupe identical (edge, turn) pairs — a single turn can
                    // produce only one directed traversal per edge in a valid
                    // path, but guard anyway.
                    if (!entry.turns.includes(turn)) entry.turns.push(turn);
                }

                const lineWidth = cfgI('ui.route.line.width', 8);
                const spacing = cfgI('ui.route.line.spacing', 9); // perpendicular gap between parallel lines
                ctx.lineWidth = lineWidth;
                for (const { a, b, turns } of segmentsByEdge.values()) {
                    const pa = points[a];
                    const pb = points[b];
                    if (!pa || !pb) continue;
                    const x1 = pa.x * imgW, y1 = pa.y * imgH;
                    const x2 = pb.x * imgW, y2 = pb.y * imgH;
                    const dx = x2 - x1, dy = y2 - y1;
                    const len = Math.hypot(dx, dy) || 1;
                    // Unit perpendicular vector
                    const px = -dy / len, py = dx / len;
                    turns.sort((u, v) => u - v);
                    const n = turns.length;
                    for (let k = 0; k < n; k++) {
                        const offset = (k - (n - 1) / 2) * spacing;
                        const ox = px * offset, oy = py * offset;
                        ctx.strokeStyle = turnColors[(turns[k] - 1) % turnColors.length];
                        ctx.beginPath();
                        ctx.moveTo(x1 + ox, y1 + oy);
                        ctx.lineTo(x2 + ox, y2 + oy);
                        ctx.stroke();
                    }
                }

                // --- Engine-segment labels ---
                // A "segment" is a contiguous run of moves within a single turn
                // using the same engine. Each new turn starts a fresh segment
                // (the ship resets its burn budget), so a label is drawn at
                // every turn boundary AND at every engine switch, not only at
                // the start of the trip.
                ctx.save();
                ctx.font = 'bold ' + cfgI('ui.engine.label.font.px', 14) + 'px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                let lastEngine = -2; // -1 is the root sentinel; use -2 so first move always triggers a label
                let lastTurn   = -1;
                const drawnAt  = new Set(); // dedupe labels that land on the same map node
                for (let i = 1; i < pathNodes.length; i++) {
                    const ei   = pathNodes[i].engineIndex;
                    const turn = pathNodes[i].turns;
                    const engineChanged = ei !== lastEngine;
                    const turnChanged   = turn !== lastTurn;
                    lastEngine = ei;
                    lastTurn   = turn;
                    if (!engineChanged && !turnChanged) continue;
                    if (ei < 0) continue;
                    const anchor = pathNodes[i - 1];
                    const p = points[anchor.nodeId];
                    if (!p) continue;
                    const key = anchor.nodeId + '|' + ei + '|' + turn;
                    if (drawnAt.has(key)) continue;
                    drawnAt.add(key);
                    const lx = p.x * imgW + 10;
                    const ly = p.y * imgH - 10;
                    const label = 'Engine ' + (ei + 1);
                    const w = ctx.measureText(label).width;
                    ctx.fillStyle = 'rgba(0,0,0,0.75)';
                    ctx.fillRect(lx - 3, ly - 16, w + 6, 18);
                    ctx.fillStyle = '#ffe066';
                    ctx.fillText(label, lx, ly);
                }
                ctx.restore();

                // --- Jettison labels ---
                // Each PathNode that started its turn with a fuel jettison
                // gets a red "Jettison N" badge anchored to that node. The
                // turn-start sits at the same map position as the previous
                // turn's last node, so we anchor to the path node itself
                // (offset below the engine label to avoid overlap).
                ctx.save();
                ctx.font = 'bold ' + cfgI('ui.engine.label.font.px', 14) + 'px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                for (let i = 0; i < pathNodes.length; i++) {
                    const j = pathNodes[i].jettisonedHere;
                    if (!j || j <= 0) continue;
                    const p = points[pathNodes[i].nodeId];
                    if (!p) continue;
                    const lx = p.x * imgW + 10;
                    const ly = p.y * imgH + 4;
                    const label = 'Jettison ' + j;
                    const w = ctx.measureText(label).width;
                    ctx.fillStyle = 'rgba(0,0,0,0.75)';
                    ctx.fillRect(lx - 3, ly - 2, w + 6, 18);
                    ctx.fillStyle = '#ff6b6b';
                    ctx.fillText(label, lx, ly);
                }
                ctx.restore();

                // Route info is rendered into the sidebar (above fuel input),
                // not onto the canvas. See updateRouteInfo().
            }
        }

        // Debug: show thrustRequired tooltip on landing burn hover
        if (debugMode && debugHoveredNode) {
            const dp = points[debugHoveredNode];
            if (dp && dp.type === 'burn' && dp.landing && dp.thrustRequired) {
                const tx = dp.x * imgW + 12;
                const ty = dp.y * imgH - 8;
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(tx - 4, ty - 14, 160, 20);
                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 13px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('thrustReq: ' + dp.thrustRequired, tx, ty);
                ctx.restore();
            }
        }

        // Draw selected start node highlight
        if (selectedNode) {
            const p = points[selectedNode];
            if (p) {
                ctx.beginPath();
                ctx.arc(p.x * imgW, p.y * imgH, 10, 0, Math.PI * 2);
                ctx.fillStyle = 'red';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
    }

    // --- Fire traverse request ---
    function fireTraverse() {
        if (!selectedNode) return;
        pinnedEndpoint = null;
        selectedRouteIndex = 0;

        const engines = [];
        document.querySelectorAll('.engine-block').forEach(block => {
            engines.push({
                baseThrust: parseInt(block.querySelector('.e-base-thrust').value) || 0,
                fuelConsumptionNum: parseInt(block.querySelector('.e-fuel').value) || 0,
                fuelConsumptionDen: 1,
                solarPowered: block.querySelector('.e-solar').checked,
                bonusPivots: parseInt(block.querySelector('.e-pivots').value) || 0,
                afterburnFuelCost: 0
            });
        });

        if (engines.length === 0) {
            document.getElementById('status').textContent = 'Add at least one engine.';
            return;
        }

        const request = {
            startNodeId: selectedNode,
            engines: engines,
            dryMass: parseInt(document.getElementById('dry-mass').value) || 0,
            fuel: parseInt(document.getElementById('fuel').value) || 0,
            disableVenusFlyby: document.getElementById('no-venus-cb').checked,
            allowFuelJettison: document.getElementById('allow-jettison-cb').checked
        };

        document.getElementById('status').textContent = 'Planning routes...';

        // Capture the tab + token at fire time. If the user switches tabs before
        // the response arrives, we discard it so the new tab isn't overwritten
        // and stale results don't get cached into the originating tab either.
        const tabAtFire = activeTab;
        const tokenAtFire = ++pendingFetchToken;
        // Client-measured round-trip time (network + server); we don't block
        // on the server producing its own measurement.
        const startedAt = performance.now();

        fetch('/api/traverse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(request)
        })
        .then(r => r.json())
        .then(data => {
            if (tokenAtFire !== pendingFetchToken || activeTab !== tabAtFire) {
                console.log('Traverse response discarded (tab switched)');
                return;
            }
            console.log('Traverse response:', data.status,
                'tree nodes:', data.tree ? 'yes' : 'no',
                'endpoints:', data.endpoints ? Object.keys(data.endpoints).length : 0);
            traverseResult = data;
            treeIndex = data.tree ? buildTreeIndex(data.tree) : null;
            console.log('Tree index built, entries:', treeIndex ? Object.keys(treeIndex).length : 0);
            const routeCount = data.endpoints ? Object.keys(data.endpoints).length : 0;
            const elapsedMs = performance.now() - startedAt;
            const elapsedStr = elapsedMs < 1000
                    ? Math.round(elapsedMs) + ' ms'
                    : (elapsedMs / 1000).toFixed(1) + ' s';
            document.getElementById('status').textContent =
                    routeCount + ' reachable sites found in ' + elapsedStr
                    + '. Hover to see routes. [' + data.status + ']';
            draw();
            persistTabs();
        })
        .catch(err => {
            if (tokenAtFire !== pendingFetchToken || activeTab !== tabAtFire) return;
            console.error('Traverse error:', err);
            document.getElementById('status').textContent = 'Error: ' + err;
        });
    }

    // --- Engine form ---
    function renumberEngines() {
        const blocks = document.querySelectorAll('.engine-block');
        blocks.forEach((block, i) => {
            block.querySelector('h3').textContent = 'Engine ' + (i + 1);
        });
        document.getElementById('add-engine').disabled = blocks.length >= cfgI('ui.engines.max', 4);
    }

    // initial: optional {baseThrust, fuelConsumption, solarPowered, bonusPivots}.
    // When called from a tab restore, suppressFire is true so we don't fire a
    // traverse for every engine block being rebuilt.
    function addEngineBlock(initial) {
        const blocks = document.querySelectorAll('.engine-block');
        if (blocks.length >= cfgI('ui.engines.max', 4)) return;
        const thrustDef = (initial && initial.baseThrust      != null) ? initial.baseThrust
                        : (initial && initial.netThrust       != null) ? initial.netThrust
                        : cfgI('ui.engine.thrust.default', 3);
        const fuelDef   = (initial && initial.fuelConsumption != null) ? initial.fuelConsumption : cfgI('ui.engine.fuel.default',   2);
        const pivotsDef = (initial && initial.bonusPivots     != null) ? initial.bonusPivots     : cfgI('ui.engine.pivots.default', 0);
        const solarDef  = !!(initial && initial.solarPowered);
        const div = document.createElement('div');
        div.className = 'engine-block';
        div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <h3 style="margin:0">Engine</h3>
                <button class="e-remove" style="padding:2px 8px;font-size:11px;margin:0">X</button>
            </div>
            <div class="engine-row">
                <div><label>Base Thrust:</label><input type="number" class="e-base-thrust" value="${thrustDef}" min="0" max="20"></div>
                <div><label>Fuel/burn:</label><input type="number" class="e-fuel" value="${fuelDef}" min="0" max="20"></div>
            </div>
            <div class="engine-row">
                <div><label>Pivots:</label><input type="number" class="e-pivots" value="${pivotsDef}" min="0" max="5"></div>
                <div><label><input type="checkbox" class="e-solar"${solarDef ? ' checked' : ''}>Solar</label></div>
            </div>
        `;
        div.querySelector('.e-remove').addEventListener('click', () => {
            div.remove();
            renumberEngines();
            fireTraverse();
            persistTabs();
        });
        div.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('change', () => { fireTraverse(); persistTabs(); });
        });
        document.getElementById('engines-container').appendChild(div);
        renumberEngines();
        if (!suppressFire) fireTraverse();
    }

    document.getElementById('add-engine').addEventListener('click', () => {
        addEngineBlock();
        persistTabs();
    });
    document.getElementById('fuel').addEventListener('change', () => { fireTraverse(); persistTabs(); });
    document.getElementById('dry-mass').addEventListener('change', () => { fireTraverse(); persistTabs(); });

    // Site filter controls — redraw only (no re-traverse, since the filter is
    // purely a visual overlay on already-computed endpoints).
    document.querySelectorAll('.site-type-cb').forEach(cb => {
        cb.addEventListener('change', () => { draw(); persistTabs(); });
    });
    document.getElementById('hydration-min').addEventListener('input', () => { draw(); persistTabs(); });
    document.getElementById('search-input').addEventListener('input', persistTabs);
})();
</script>
</body>
