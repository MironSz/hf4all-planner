                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(tx - 4, ty - 14, 160, 20);
                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 13px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('thrustReq: ' + dp.thrustRequired, tx, ty);
                ctx.restore();
            }
        }

        // Draw "NOT REACHABLE" badge over EVERY site that's not in reachableNodes,
        // once a traverse has run. Width = 1.15 × diameter of the green filter
        // ring so the badge is always wider than the reachable indicator.
        if (reachableNodes) {
            ctx.save();
            const targetWidth = cfgI('ui.filter.ring.radius', 42) * 2 * 1.15;
            let fontPx = 14;
            ctx.font = 'bold ' + fontPx + 'px monospace';
            const baseW = ctx.measureText('NOT REACHABLE').width;
            fontPx = Math.max(8, Math.round(fontPx * targetWidth / baseW));
            ctx.font = 'bold ' + fontPx + 'px monospace';
            const w = ctx.measureText('NOT REACHABLE').width;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (const [id, p] of Object.entries(points)) {
                if (p.type !== 'site') continue;
                if (id in reachableNodes) continue;
                const x = p.x * imgW;
                const y = p.y * imgH;
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(x - w / 2 - 4, y - fontPx / 2 - 3, w + 8, fontPx + 6);
                ctx.fillStyle = '#ff3a3a';
                ctx.fillText('NOT REACHABLE', x, y);
            }
            ctx.restore();
        }

        // Filter-matching rings — high-contrast version, drawn LAST so nothing
        // sits on top of them. Each match gets:
        //   • dark 6 px outer halo (separates the ring from the busy map)
        //   • bright green 3 px inner ring + 40 % green fill
        //   • a 3 px solid green dot at the centre, so the eye anchors even
        //     when the ring spills off-screen.
        if (traverseResult && traverseResult.endpoints && filter.active) {
            const ringR = cfgI('ui.filter.ring.radius', 42);
            const ringColor = 'rgba(50, 230, 110, 1.0)';
            const ringFill  = 'rgba(50, 230, 110, 0.40)';
            const haloColor = 'rgba(0, 0, 0, 0.85)';
            for (const nodeId of Object.keys(traverseResult.endpoints)) {
                const p = points[nodeId];
                if (!p || p.type !== 'site') continue;
                if (!siteMatchesFilter(p, filter)) continue;
                const cx = p.x * imgW, cy = p.y * imgH;
                // Dark halo
                ctx.beginPath();
                ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
                ctx.lineWidth = 6;
                ctx.strokeStyle = haloColor;
                ctx.stroke();
                // Bright ring + translucent fill
                ctx.beginPath();
                ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
                ctx.fillStyle = ringFill;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = ringColor;
                ctx.stroke();
                // Centre anchor dot
                ctx.beginPath();
                ctx.arc(cx, cy, 3, 0, Math.PI * 2);
                ctx.fillStyle = ringColor;
                ctx.fill();
            }
        }

        // Draw selected start node highlight
        if (selectedNode) {
            const p = points[selectedNode];
            if (p) {
                ctx.beginPath();
                ctx.arc(p.x * imgW, p.y * imgH, 10, 0, Math.PI * 2);
                ctx.fillStyle = 'red';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
    }

    // --- Fire traverse request ---
    function fireTraverse() {
        if (!selectedNode) return;
        pinnedEndpoint = null;
        selectedRouteIndex = 0;

        const engines = [];
        document.querySelectorAll('.engine-block').forEach(block => {
            engines.push({
                baseThrust: parseInt(block.querySelector('.e-base-thrust').value) || 0,
                fuelConsumptionNum: parseInt(block.querySelector('.e-fuel').value) || 0,
                fuelConsumptionDen: 1,
                solarPowered: block.querySelector('.e-solar').checked,
                bonusPivots: parseInt(block.querySelector('.e-pivots').value) || 0,
                afterburnFuelCost: 0
            });
        });

        if (engines.length === 0) {
            document.getElementById('status').textContent = 'Add at least one engine.';
            return;
        }

        const request = {
            startNodeId: selectedNode,
            engines: engines,
            dryMass: parseInt(document.getElementById('dry-mass').value) || 0,
            fuel: parseInt(document.getElementById('fuel').value) || 0,
            disableVenusFlyby: document.getElementById('no-venus-cb').checked,
            allowFuelJettison: document.getElementById('allow-jettison-cb').checked
        };

        document.getElementById('status').textContent = 'Planning routes...';

        // Capture the tab + token at fire time. If the user switches tabs before
        // the response arrives, we discard it so the new tab isn't overwritten
        // and stale results don't get cached into the originating tab either.
        const tabAtFire = activeTab;
        const tokenAtFire = ++pendingFetchToken;
        // Client-measured round-trip time (network + server); we don't block
        // on the server producing its own measurement.
        const startedAt = performance.now();

        fetch('/api/traverse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(request)
        })
        .then(r => r.json())
        .then(data => {
            if (tokenAtFire !== pendingFetchToken || activeTab !== tabAtFire) {
                console.log('Traverse response discarded (tab switched)');
                return;
            }
            console.log('Traverse response:', data.status,
                'tree nodes:', data.tree ? 'yes' : 'no',
                'endpoints:', data.endpoints ? Object.keys(data.endpoints).length : 0);
            traverseResult = data;
            treeIndex = data.tree ? buildTreeIndex(data.tree) : null;
            console.log('Tree index built, entries:', treeIndex ? Object.keys(treeIndex).length : 0);
            const routeCount = data.endpoints ? Object.keys(data.endpoints).length : 0;
            const elapsedMs = performance.now() - startedAt;
            const elapsedStr = elapsedMs < 1000
                    ? Math.round(elapsedMs) + ' ms'
                    : (elapsedMs / 1000).toFixed(1) + ' s';
            document.getElementById('status').textContent =
                    routeCount + ' reachable sites found in ' + elapsedStr
                    + '. Hover to see routes. [' + data.status + ']';
            draw();
            persistTabs();
        })
        .catch(err => {
            if (tokenAtFire !== pendingFetchToken || activeTab !== tabAtFire) return;
            console.error('Traverse error:', err);
            document.getElementById('status').textContent = 'Error: ' + err;
        });
    }

    // --- Engine form ---
    function renumberEngines() {
        const blocks = document.querySelectorAll('.engine-block');
        blocks.forEach((block, i) => {
            block.querySelector('h3').textContent = 'Engine ' + (i + 1);
        });
        document.getElementById('add-engine').disabled = blocks.length >= cfgI('ui.engines.max', 4);
    }

    // initial: optional {baseThrust, fuelConsumption, solarPowered, bonusPivots}.
    // When called from a tab restore, suppressFire is true so we don't fire a
    // traverse for every engine block being rebuilt.
    function addEngineBlock(initial) {
        const blocks = document.querySelectorAll('.engine-block');
        if (blocks.length >= cfgI('ui.engines.max', 4)) return;
        const thrustDef = (initial && initial.baseThrust      != null) ? initial.baseThrust
                        : (initial && initial.netThrust       != null) ? initial.netThrust
                        : cfgI('ui.engine.thrust.default', 3);
        const fuelDef   = (initial && initial.fuelConsumption != null) ? initial.fuelConsumption : cfgI('ui.engine.fuel.default',   2);
        const pivotsDef = (initial && initial.bonusPivots     != null) ? initial.bonusPivots     : cfgI('ui.engine.pivots.default', 0);
        const solarDef  = !!(initial && initial.solarPowered);
        const div = document.createElement('div');
        div.className = 'engine-block';
        div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <h3 style="margin:0">Engine</h3>
                <button class="e-remove" style="padding:2px 8px;font-size:11px;margin:0">X</button>
            </div>
            <div class="engine-row">
                <div><label>Base Thrust: <span class="tip" data-tip="Engine thrust per burn before adjustments.">?</span></label><input type="number" class="e-base-thrust" value="${thrustDef}" min="0" max="20"></div>
                <div><label>Fuel/burn: <span class="tip" data-tip="Fuel steps this engine consumes per burn. Most engines are 1–2; high-thrust engines cost more.">?</span></label><input type="number" class="e-fuel" value="${fuelDef}" min="0" max="20"></div>
            </div>
            <div class="engine-row">
                <div><label>Pivots: <span class="tip" data-tip="Lets you turn at non-Lagrange nodes without ending the turn or performing double burn.">?</span></label><input type="number" class="e-pivots" value="${pivotsDef}" min="0" max="5"></div>
                <div><label><input type="checkbox" class="e-solar"${solarDef ? ' checked' : ''}>Solar <span class="tip" data-tip="Solar-powered engine: thrust scales with distance from the Sun.">?</span></label></div>
            </div>
        `;
        div.querySelector('.e-remove').addEventListener('click', () => {
            div.remove();
            renumberEngines();
            fireTraverse();
            persistTabs();
        });
        div.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('change', () => { fireTraverse(); persistTabs(); });
        });
        document.getElementById('engines-container').appendChild(div);
        renumberEngines();
        if (!suppressFire) fireTraverse();
    }

    document.getElementById('add-engine').addEventListener('click', () => {
        addEngineBlock();
        persistTabs();
    });
    document.getElementById('fuel').addEventListener('change', () => { fireTraverse(); persistTabs(); });
    document.getElementById('dry-mass').addEventListener('change', () => { fireTraverse(); persistTabs(); });

    // Sidebar collapse toggle. Persisted to localStorage so the choice sticks
    // across reloads.
    (function() {
        const SIDEBAR_KEY = 'hf4a-sidebar-collapsed';
        const btn = document.getElementById('sidebar-toggle');
        function apply(collapsed) {
            document.body.classList.toggle('sidebar-collapsed', collapsed);
            btn.textContent = collapsed ? '\u00ab' : '\u00bb';
            btn.title = collapsed ? 'Show side panel' : 'Hide side panel';
        }
        apply(localStorage.getItem(SIDEBAR_KEY) === '1');
        btn.addEventListener('click', () => {
            const collapsed = !document.body.classList.contains('sidebar-collapsed');
            apply(collapsed);
            try { localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0'); } catch (e) {}
        });
        document.getElementById('sidebar-clear').addEventListener('click', clearRoutes);
        document.getElementById('sidebar-prev').addEventListener('click', () => cycleRoute(-1));
        document.getElementById('sidebar-next').addEventListener('click', () => cycleRoute(+1));
    })();

    // Site filter controls — redraw only (no re-traverse, since the filter is
    // purely a visual overlay on already-computed endpoints).

    // Build the modifier checkbox grid.
    (function buildFlagGrid() {
        const host = document.getElementById('site-flag-grid');
        SITE_FLAG_KEYS.forEach(f => {
            const row = document.createElement('label');
            row.className = 'flag-cb-row';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.id = 'flag-cb-' + f.key;
            cb.addEventListener('change', onFilterChanged);
            const label = document.createElement('span');
            label.textContent = f.label;
            row.appendChild(cb);
            row.appendChild(label);
            host.appendChild(row);
        });
    })();

    function onFilterChanged() {
        updateFilterHeader();
        draw();
        persistTabs();
    }

    document.querySelectorAll('.site-type-cb').forEach(cb => {
        cb.addEventListener('change', onFilterChanged);
    });
    document.getElementById('site-type-none').addEventListener('click', () => {
        document.querySelectorAll('.site-type-cb').forEach(cb => { cb.checked = false; });
        onFilterChanged();
    });

    document.getElementById('hydration-min').addEventListener('input', onFilterChanged);
    document.getElementById('synodic-filter').addEventListener('change', onFilterChanged);
    // Initialise and wire the ANY/ALL modifier-mode toggle.
    setFlagsMode('any');
    document.getElementById('flags-mode-toggle').addEventListener('click', (e) => {
        e.stopPropagation();
        const btn = e.currentTarget;
        setFlagsMode(btn.dataset.mode === 'all' ? 'any' : 'all');
        onFilterChanged();
    });

    // Accordion open/close
    function setFilterOpen(open) {
        document.getElementById('site-filter-body').classList.toggle('open', open);
        document.getElementById('site-filter-toggle').classList.toggle('open', open);
    }
    document.getElementById('site-filter-header').addEventListener('click', (e) => {
        // Don't toggle when the user clicked the inline reset button.
        if (e.target.closest('#site-filter-reset')) return;
        const body = document.getElementById('site-filter-body');
        setFilterOpen(!body.classList.contains('open'));
    });

    // Reset all filters back to defaults.
    function resetSiteFilter() {
        writeSiteFilterToDom(makeDefaultSiteFilter());
        onFilterChanged();
    }
    document.getElementById('site-filter-reset').addEventListener('click', (e) => {
        e.stopPropagation();
        resetSiteFilter();
    });

    // Keyboard: F toggles the panel, Shift+F resets filters.
    // Ignored while typing in any input/textarea/contenteditable.
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'
                  || t.tagName === 'SELECT' || t.isContentEditable)) return;
        if (e.key === 'F') {           // Shift+F
            e.preventDefault();
            resetSiteFilter();
        } else if (e.key === 'f') {    // bare F
            e.preventDefault();
            const body = document.getElementById('site-filter-body');
            setFilterOpen(!body.classList.contains('open'));
        }
    });

    document.getElementById('search-input').addEventListener('input', persistTabs);

    // Keep the header summary current once the map has loaded (counts need points).
    (function waitForMap() {
        if (mapData) { updateFilterHeader(); return; }
        setTimeout(waitForMap, 100);
    })();
})();
</script>
</body>
</html>
