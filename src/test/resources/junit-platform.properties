# Default per-test timeout. Tests in this project mostly run real
# integration-flavoured pathfinder searches; a regression in the search
# (especially around season-aware Pareto rules) can quietly multiply
# frontier size and make a single test take many minutes. Failing fast
# is preferable to letting the suite hang until the surefire fork
# timeout (5 minutes) hits.
#
# Override with @Timeout on a specific test/class for legitimately-slow
# cases (e.g. season-cycle alignment scenarios).
junit.jupiter.execution.timeout.default=120s
junit.jupiter.execution.timeout.testable.method.default=120s

# Parallel test execution (this PC has 8 cores / 16 logical cores).
# Tests are independent — every Pathfinder instance owns its own
# bestFound + queue, so concurrent runs don't share search state.
# Test classes run concurrently; methods within a class stay sequential
# to avoid surprises with shared @BeforeAll-loaded SolarMap singletons.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
# 12 ≈ 75% of this machine's 16 logical cores, leaving headroom for the
# OS / IDE / browser preview. Adjust to your hardware if the suite runs
# noticeably hotter.
junit.jupiter.execution.parallel.config.fixed.parallelism=12
junit.jupiter.execution.parallel.config.fixed.max-pool-size=14
